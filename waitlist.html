<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join the Waitlist — ViewsCrush App</title>
  <meta name="description" content="Script, record, and track everything in one creator workspace. Join the waitlist for early access to the ViewsCrush App.">
  <link rel="canonical" href="https://www.viewscrush.com/waitlist.html">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #141414;
      --red: #E81C1C;
      --text: #f0ede6;
      --muted: rgba(240,237,230,0.5);
      --card: #1a1a1a;
      --border: rgba(255,255,255,0.08);
      --font: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.6;
      overflow-x: hidden;
    }

    .top-logo {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 10;
      padding: 2rem 3.5rem;
    }

    .top-logo a {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      color: var(--text);
    }

    .top-logo img { height: 28px; width: 28px; border-radius: 4px; }
    .top-logo span { color: var(--red); }

    .stage {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 120px 24px;
      position: relative;
      overflow: hidden;
      background: #1a1a1c;
    }

    .stage::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 280px;
      background: linear-gradient(to bottom, transparent, var(--bg));
      pointer-events: none;
      z-index: 2;
    }

    #stars-canvas { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
    #shooting-stars-svg { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: visible; }

    .waitlist-box {
      position: relative;
      z-index: 3;
      max-width: 480px;
      width: 100%;
    }

    .eyebrow {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--red);
      background: rgba(232,28,28,0.07);
      padding: 5px 14px;
      border-radius: 100px;
      margin-bottom: 20px;
    }

    h1 {
      font-weight: 800;
      font-size: clamp(38px, 6vw, 64px);
      line-height: 1.05;
      letter-spacing: -2px;
      margin-bottom: 20px;
      text-shadow: 0 2px 24px rgba(0,0,0,0.5);
    }

    h1 .accent { color: var(--red); }

    p.sub {
      color: var(--muted);
      font-size: 17px;
      max-width: 420px;
      margin: 0 auto 40px;
      line-height: 1.75;
    }

    #waitlist-form {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 12px;
    }

    #waitlist-email {
      flex: 1;
      min-width: 220px;
      padding: 14px 18px;
      border-radius: 100px;
      border: 1px solid var(--border);
      background: rgba(26,26,26,0.7);
      backdrop-filter: blur(6px);
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s;
    }

    #waitlist-email:focus { border-color: rgba(232,28,28,0.5); }
    #waitlist-email::placeholder { color: var(--muted); }

    #waitlist-btn {
      font-weight: 600;
      font-size: 14px;
      padding: 14px 32px;
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: 100px;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.2s, transform 0.15s;
      white-space: nowrap;
    }

    #waitlist-btn:hover:not(:disabled) { opacity: 0.84; transform: translateY(-1px); }
    #waitlist-btn:disabled { opacity: 0.6; cursor: default; }

    #waitlist-message {
      font-size: 14px;
      color: var(--muted);
      min-height: 20px;
    }

    .back-link {
      display: inline-block;
      margin-top: 28px;
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.2s;
    }

    .back-link:hover { color: var(--text); }

    @media (max-width: 480px) {
      .top-logo { padding: 1.5rem; }
      .stage { padding: 100px 20px; }
    }
  </style>
</head>
<body>

  <div class="top-logo">
    <a href="/"><img src="brand-logo.png" alt=""><span style="color:var(--text);">Views<span style="color:var(--red);">Crush</span></span></a>
  </div>

  <div class="stage">
    <canvas id="stars-canvas"></canvas>
    <svg id="shooting-stars-svg"></svg>

    <div class="waitlist-box">
      <span class="eyebrow waitlist-anim">Coming Soon</span>
      <h1 class="waitlist-anim">The ViewsCrush <span class="accent">App.</span></h1>
      <p class="sub waitlist-anim">Script, record, and track everything in one creator workspace. Join the waitlist for early access.</p>

      <form id="waitlist-form" class="waitlist-anim">
        <input type="email" id="waitlist-email" required placeholder="you@email.com">
        <button type="submit" id="waitlist-btn">Join Waitlist</button>
      </form>
      <p id="waitlist-message" class="waitlist-anim"></p>

      <a href="/" class="back-link waitlist-anim">← Back to ViewsCrush</a>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    (function(){
      var canvas=document.getElementById('stars-canvas');
      if(!canvas)return;
      var ctx=canvas.getContext('2d');
      var stars=[];
      var density=0.00012;
      function resize(){
        var rect=canvas.parentElement.getBoundingClientRect();
        canvas.width=rect.width; canvas.height=rect.height;
        var count=Math.floor(rect.width*rect.height*density);
        stars=[];
        for(var i=0;i<count;i++){ stars.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,r:Math.random()*1.1+0.4,base:Math.random()*0.4+0.35,speed:Math.random()*0.5+0.5,phase:Math.random()*Math.PI*2}); }
      }
      function draw(t){
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle='#f0ede6';
        stars.forEach(function(s){ var tw=Math.sin(t*0.001*s.speed+s.phase)*0.5+0.5; ctx.globalAlpha=s.base*tw+0.12; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill(); });
        ctx.globalAlpha=1; requestAnimationFrame(draw);
      }
      resize(); window.addEventListener('resize',resize); requestAnimationFrame(draw);
    })();

    (function(){
      var svg=document.getElementById('shooting-stars-svg');
      if(!svg)return;
      var minSpeed=8,maxSpeed=18,minDelay=4200,maxDelay=8700;
      svg.innerHTML='<defs><linearGradient id="ssGrad" x1="0%" y1="0%" x2="100%" y2="0%"><stop offset="0%" stop-color="#f0ede6" stop-opacity="0"/><stop offset="100%" stop-color="#f0ede6" stop-opacity="1"/></linearGradient><filter id="ssGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2"/></filter></defs>';
      function spawn(){
        var rect=svg.getBoundingClientRect();
        var startX=Math.random()*rect.width, startY=Math.random()*rect.height;
        var angle=Math.random()*360, rad=angle*Math.PI/180;
        var speed=Math.random()*(maxSpeed-minSpeed)+minSpeed;
        var dist=Math.max(rect.width,rect.height)*1.3;
        var dx=Math.cos(rad)*dist, dy=Math.sin(rad)*dist;
        var star=document.createElementNS('http://www.w3.org/2000/svg','rect');
        star.setAttribute('width',70); star.setAttribute('height',2); star.setAttribute('rx',1);
        star.setAttribute('fill','url(#ssGrad)'); star.setAttribute('filter','url(#ssGlow)');
        star.setAttribute('x',startX); star.setAttribute('y',startY);
        star.setAttribute('transform','rotate('+angle+' '+startX+' '+startY+')');
        svg.appendChild(star);
        var duration=(dist/speed)*9, startTime=null;
        function animate(ts){
          if(!startTime)startTime=ts;
          var progress=(ts-startTime)/duration;
          if(progress>=1){ if(star.parentNode)svg.removeChild(star); scheduleNext(); return; }
          var curX=startX+dx*progress, curY=startY+dy*progress;
          star.setAttribute('x',curX); star.setAttribute('y',curY);
          star.setAttribute('transform','rotate('+angle+' '+curX+' '+curY+')');
          star.setAttribute('opacity',1-progress*0.6);
          requestAnimationFrame(animate);
        }
        requestAnimationFrame(animate);
      }
      function scheduleNext(first){ setTimeout(spawn, first?800:Math.random()*(maxDelay-minDelay)+minDelay); }
      scheduleNext(true);
    })();

    gsap.from('.top-logo', { opacity: 0, y: -12, duration: 0.7, ease: 'power2.out' });
    gsap.from('.waitlist-anim', {
      opacity: 0,
      y: 28,
      duration: 0.8,
      delay: 0.3,
      stagger: 0.12,
      ease: 'power3.out'
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

      'https://sbgvdlpcfkfxvwdborbw.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNiZ3ZkbHBjZmtmeHZ3ZGJvcmJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0OTE0NzcsImV4cCI6MjA5OTA2NzQ3N30.2_7d7QnwUoTBshRD65LL_MpM0ciMSw52Ir1yS8aDzA8'
    );

    const wlForm = document.getElementById('waitlist-form');
    const wlEmail = document.getElementById('waitlist-email');
    const wlMsg = document.getElementById('waitlist-message');
    const wlBtn = document.getElementById('waitlist-btn');

    wlForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = wlEmail.value.trim();
      if (!email) return;

      wlBtn.disabled = true;
      wlBtn.textContent = 'Joining...';
      wlMsg.style.color = 'var(--muted)';
      wlMsg.textContent = '';

      const { error } = await _sb.from('waitlist').insert({ email });

      if (error) {
        wlMsg.style.color = 'var(--red)';
        wlMsg.textContent = error.code === '23505' ? "You're already on the list!" : 'Something went wrong. Please try again.';
        wlBtn.disabled = false;
        wlBtn.textContent = 'Join Waitlist';
      } else {
        wlMsg.style.color = '#4ade80';
        wlMsg.textContent = "You're on the list! We'll email you when it's ready.";
        wlEmail.value = '';
        wlBtn.textContent = 'Joined ✓';
      }
    });
  </script>
</body>
</html>
