<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join the Waitlist — ViewsCrush App</title>
  <meta name="description" content="Script, record, and track everything in one creator workspace. Join the waitlist for early access to the ViewsCrush App.">
  <link rel="canonical" href="https://www.viewscrush.com/waitlist.html">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <script>window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };</script>
  <script defer src="/_vercel/insights/script.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #141414;
      --red: #E81C1C;
      --text: #f0ede6;
      --muted: rgba(240,237,230,0.5);
      --card: #1a1a1a;
      --border: rgba(255,255,255,0.08);
      --font: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      font-size: 16px;
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .top-logo {
      padding: 2rem 3.5rem 0;
    }

    .top-logo a {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      color: var(--text);
    }

    .top-logo img { height: 28px; width: 28px; border-radius: 4px; }
    .top-logo span { color: var(--red); }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
    }

    .waitlist-box {
      max-width: 480px;
      width: 100%;
      text-align: center;
    }

    .eyebrow {
      display: inline-block;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--red);
      background: rgba(232,28,28,0.07);
      padding: 5px 14px;
      border-radius: 100px;
      margin-bottom: 20px;
    }

    h1 {
      font-weight: 800;
      font-size: clamp(32px, 5vw, 48px);
      line-height: 1.1;
      letter-spacing: -1.5px;
      margin-bottom: 16px;
    }

    h1 .accent { color: var(--red); }

    p.sub {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
      margin-bottom: 36px;
    }

    #waitlist-form {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 12px;
    }

    #waitlist-email {
      flex: 1;
      min-width: 220px;
      padding: 14px 18px;
      border-radius: 100px;
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      font-size: 15px;
      font-family: inherit;
      outline: none;
    }

    #waitlist-email::placeholder { color: var(--muted); }

    #waitlist-btn {
      font-weight: 600;
      font-size: 14px;
      padding: 14px 32px;
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: 100px;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.2s, transform 0.15s;
      white-space: nowrap;
    }

    #waitlist-btn:hover:not(:disabled) { opacity: 0.84; transform: translateY(-1px); }
    #waitlist-btn:disabled { opacity: 0.6; cursor: default; }

    #waitlist-message {
      font-size: 14px;
      color: var(--muted);
      min-height: 20px;
    }

    .back-link {
      display: inline-block;
      margin-top: 32px;
      font-size: 13px;
      color: var(--muted);
      text-decoration: none;
    }

    .back-link:hover { color: var(--text); }

    footer {
      padding: 24px 3.5rem;
      text-align: center;
      font-size: 13px;
      color: var(--muted);
    }

    @media (max-width: 480px) {
      .top-logo { padding: 1.5rem 1.5rem 0; }
      footer { padding: 20px 1.5rem; }
    }
  </style>
</head>
<body>

  <div class="top-logo">
    <a href="/"><img src="brand-logo.png" alt=""><span style="color:var(--text);">Views<span style="color:var(--red);">Crush</span></span></a>
  </div>

  <main>
    <div class="waitlist-box">
      <span class="eyebrow">Coming Soon</span>
      <h1>The ViewsCrush <span class="accent">App.</span></h1>
      <p class="sub">Script, record, and track everything in one creator workspace. Join the waitlist for early access.</p>

      <form id="waitlist-form">
        <input type="email" id="waitlist-email" required placeholder="you@email.com">
        <button type="submit" id="waitlist-btn">Join Waitlist</button>
      </form>
      <p id="waitlist-message"></p>

      <a href="/" class="back-link">← Back to ViewsCrush</a>
    </div>
  </main>

  <footer>
    © 2026 ViewsCrush. All rights reserved.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const _sb = supabase.createClient(
      'https://sbgvdlpcfkfxvwdborbw.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNiZ3ZkbHBjZmtmeHZ3ZGJvcmJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM0OTE0NzcsImV4cCI6MjA5OTA2NzQ3N30.2_7d7QnwUoTBshRD65LL_MpM0ciMSw52Ir1yS8aDzA8'
    );

    const wlForm = document.getElementById('waitlist-form');
    const wlEmail = document.getElementById('waitlist-email');
    const wlMsg = document.getElementById('waitlist-message');
    const wlBtn = document.getElementById('waitlist-btn');

    wlForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = wlEmail.value.trim();
      if (!email) return;

      wlBtn.disabled = true;
      wlBtn.textContent = 'Joining...';
      wlMsg.style.color = 'var(--muted)';
      wlMsg.textContent = '';

      const { error } = await _sb.from('waitlist').insert({ email });

      if (error) {
        wlMsg.style.color = 'var(--red)';
        wlMsg.textContent = error.code === '23505' ? "You're already on the list!" : 'Something went wrong. Please try again.';
        wlBtn.disabled = false;
        wlBtn.textContent = 'Join Waitlist';
      } else {
        wlMsg.style.color = '#4ade80';
        wlMsg.textContent = "You're on the list! We'll email you when it's ready.";
        wlEmail.value = '';
        wlBtn.textContent = 'Joined ✓';
      }
    });
  </script>
</body>
</html>
